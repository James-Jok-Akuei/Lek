<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lëk">
  <!-- Lëk favicon: the wordmark's L in cream on the deep-forest brand colour,
       with a gold dot for the early-warning signal. Only three shapes, so it
       stays legible at the 16px a browser tab actually renders. -->
  <rect width="64" height="64" rx="14" fill="#1f352c"/>
  <g fill="#f5f6e3">
    <rect x="19" y="16" width="10.5" height="30" rx="4"/>
    <rect x="19" y="35.5" width="25" height="10.5" rx="4"/>
  </g>
  <circle cx="46.5" cy="20.5" r="6.5" fill="#e6b53e"/>
</svg>
